<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Lierre AR - WebAR Autonome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #overlay-ui {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 3;
    }
    .btn {
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid #4CAF50;
      color: #fff;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 28px;
      cursor: pointer;
    }
    #info-text {
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
  <!-- Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <video id="camera-video" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <div id="overlay-ui">
    <button id="start-btn" class="btn">DÉMARRER LA CAMÉRA</button>
    <div id="info-text">Touche l'écran pour faire germer du lierre</div>
  </div>

  <script>
    const video = document.getElementById('camera-video');
    const startBtn = document.getElementById('start-btn');
    const infoText = document.getElementById('info-text');

    let scene, camera, renderer;
    let plants = [];

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.z = 1.5;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      window.addEventListener('click', onTouch);
      animate();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        startBtn.style.display = 'none';
        initThree();
      } catch (err) {
        alert("Impossible d'accéder à la caméra : " + err.message);
      }
    }

    // Gestion de l'orientation du smartphone
    window.addEventListener('deviceorientation', (event) => {
      if (!camera) return;
      const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
      const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
      const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
      camera.rotation.set(beta - Math.PI / 2, gamma, alpha, 'ZXY');
    });

    // Structure de croissance procédurale de tige
    function spawnVine(x, y, z) {
      const vineGroup = new THREE.Group();
      vineGroup.position.set(x, y, z);

      const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.6 });
      const leafMaterial = new THREE.MeshStandardMaterial({ color: 0x66bb6a, side: THREE.DoubleSide });

      const vine = {
        group: vineGroup,
        currentHeight: 0,
        maxHeight: 1.2 + Math.random() * 0.8,
        step: 0,
        grow() {
          if (this.currentHeight >= this.maxHeight) return;

          const segHeight = 0.05;
          const geom = new THREE.CylinderGeometry(0.008, 0.012, segHeight, 6);
          const seg = new THREE.Mesh(geom, stemMaterial);

          seg.position.y = this.currentHeight + segHeight / 2;
          seg.rotation.z = (Math.sin(this.step) * 0.15);
          this.group.add(seg);

          // Ajout d'une feuille tous les 2 segments
          if (this.step % 2 === 0) {
            const leafGeom = new THREE.CircleGeometry(0.035, 5);
            const leaf = new THREE.Mesh(leafGeom, leafMaterial);
            leaf.position.set(
              Math.sin(this.step) * 0.02,
              this.currentHeight + segHeight,
              0.01
            );
            leaf.rotation.y = (this.step % 4 === 0) ? 0.4 : -0.4;
            this.group.add(leaf);
          }

          this.currentHeight += segHeight * 0.85;
          this.step++;
        }
      };

      scene.add(vineGroup);
      plants.push(vine);
    }

    function onTouch(e) {
      if (startBtn.style.display !== 'none') return;
      // Positionne un germe dans l'espace face à la caméra
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = -(e.clientY / window.innerHeight) * 2 + 1;
      spawnVine(normX * 0.5, normY * 0.5 - 0.2, 0.2);
    }

    function animate() {
      requestAnimationFrame(animate);
      plants.forEach(p => p.grow());
      renderer.render(scene, camera);
    }

    startBtn.addEventListener('click', startCamera);
  </script>
</body>
</html>
